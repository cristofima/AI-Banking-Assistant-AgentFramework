name: Python CI
description: Set up a Python project, verify syntax, run tests, and publish test artifacts.

inputs:
  project-path:
    description: Path to the Python project.
    required: true
  python-version:
    description: Python version used by the project.
    required: false
    default: "3.11"
  pytest-path:
    description: Preferred test directory relative to the project.
    required: false
    default: tests
  artifact-name:
    description: Name of the uploaded test artifact.
    required: false
    default: python-test-results
  run-tests:
    description: Whether pytest should run when a test directory exists.
    required: false
    default: "true"
  deployment-requirements:
    description: Optional project-relative Oryx requirements artifact to verify against pyproject.toml.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true
        save-cache: true
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.project-path }}
      run: |
        set -euo pipefail
        if uv sync --dev --frozen; then
          echo "Installed dependencies with --dev"
        elif uv sync --frozen; then
          echo "Installed dependencies without --dev"
        else
          echo "::error::Unable to sync dependencies for ${{ inputs.project-path }}"
          exit 1
        fi

    - name: Verify deployment requirements
      if: ${{ inputs.deployment-requirements != '' }}
      shell: bash
      working-directory: ${{ inputs.project-path }}
      env:
        REQUIREMENTS_FILE: ${{ inputs.deployment-requirements }}
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        set -euo pipefail
        generated="$(mktemp)"
        trap 'rm -f "$generated"' EXIT
        uv pip compile pyproject.toml --no-emit-package banking-shared \
          --python-version "$PYTHON_VERSION" --python-platform x86_64-unknown-linux-gnu \
          --constraints "$REQUIREMENTS_FILE" --output-file "$generated" > /dev/null
        if grep -Eq '(^-e[[:space:]]|file:| @ |^\.?\.?/)' "$REQUIREMENTS_FILE" "$generated"; then
          echo "::error::Deployment requirements must not contain editable or local package paths."
          exit 1
        fi
        diff -u <(sed 's/#.*//; s/[[:space:]]*$//; /^[[:space:]]*$/d' "$REQUIREMENTS_FILE") \
          <(sed 's/#.*//; s/[[:space:]]*$//; /^[[:space:]]*$/d' "$generated")

    - name: Compile check (syntax)
      shell: bash
      working-directory: ${{ inputs.project-path }}
      run: uv run --frozen --no-sync --no-build python -m compileall -q .

    - name: Detect test path
      id: detect-tests
      shell: bash
      working-directory: ${{ inputs.project-path }}
      run: |
        set -euo pipefail
        if [ -d "${{ inputs.pytest-path }}" ]; then
          echo "path=${{ inputs.pytest-path }}" >> "$GITHUB_OUTPUT"
          echo "exists=true" >> "$GITHUB_OUTPUT"
        elif [ -d "tests" ]; then
          echo "path=tests" >> "$GITHUB_OUTPUT"
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "path=" >> "$GITHUB_OUTPUT"
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Run tests
      if: ${{ inputs.run-tests == 'true' && steps.detect-tests.outputs.exists == 'true' }}
      shell: bash
      working-directory: ${{ inputs.project-path }}
      run: uv run --frozen --no-sync --no-build python -m pytest -q "${{ steps.detect-tests.outputs.path }}" --junitxml=junit.xml

    - name: Skip tests (no test directory)
      if: ${{ inputs.run-tests == 'true' && steps.detect-tests.outputs.exists != 'true' }}
      shell: bash
      working-directory: ${{ inputs.project-path }}
      run: echo "No tests directory found in ${{ inputs.project-path }}; skipping pytest"

    - name: Upload test and coverage artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.project-path }}/junit.xml
          ${{ inputs.project-path }}/coverage.xml
        retention-days: 14
        if-no-files-found: ignore

    - name: Coverage summary
      if: ${{ !cancelled() && hashFiles(format('{0}/coverage.xml', inputs.project-path)) != '' }}
      continue-on-error: true
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: ${{ inputs.project-path }}/coverage.xml
        format: markdown
        output: both

    - name: Add coverage summary to job summary
      if: ${{ !cancelled() && hashFiles(format('{0}/coverage.xml', inputs.project-path)) != '' }}
      continue-on-error: true
      shell: bash
      run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

    - name: Test report
      if: ${{ !cancelled() && github.event_name == 'push' && hashFiles(format('{0}/junit.xml', inputs.project-path)) != '' }}
      uses: dorny/test-reporter@v3.0.0
      with:
        name: Pytest Results (${{ inputs.project-path }})
        path: ${{ inputs.project-path }}/junit.xml
        reporter: python-xunit
