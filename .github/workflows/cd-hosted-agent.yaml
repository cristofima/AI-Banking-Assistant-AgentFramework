name: Deploy Foundry Hosted Agent

on:
  push:
    branches:
      - main
    paths:
      - "app/agent/**"
      - "!app/agent/**/*.md"
      - ".github/workflows/cd-hosted-agent.yaml"
      - ".github/actions/cd-azure/**"
      - ".github/actions/appservice-preflight/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: hosted-agent-development
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
      - name: Verify hosted deployment validation
        run: node --test .github/actions/appservice-preflight/hosted.test.cjs .github/actions/appservice-preflight/preflight.test.cjs
      - name: Verify hosted requirements
        working-directory: app/agent
        run: |
          set -euo pipefail
          generated="$(mktemp)"
          trap 'rm -f "$generated"' EXIT
          uv export --frozen --no-dev --no-editable --no-hashes --no-header \
            --output-file "$generated" > /dev/null
          diff -u requirements.txt "$generated"
      - uses: ./.github/actions/cd-azure
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          location: ${{ vars.AZURE_LOCATION }}
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          working-directory: app/agent
      - name: Install Foundry extensions
        run: azd -C app/agent ext install microsoft.foundry
      - name: Resolve shared secrets from Key Vault
        env:
          AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
        run: |
          set -euo pipefail
          if [ -z "$AZURE_KEY_VAULT_NAME" ]; then
            echo "::error::Missing required GitHub environment variable: AZURE_KEY_VAULT_NAME"
            exit 1
          fi
          # Hosted environment substitution requires the existing transport signer.
          # OAuth private keys/client secrets remain in Identity/BFF or owner-managed connections.
          INTERNAL_IDENTITY_SECRET="$(az keyvault secret show \
            --vault-name "$AZURE_KEY_VAULT_NAME" \
            --name internal-identity-secret \
            --query value --output tsv)"
          echo "::add-mask::$INTERNAL_IDENTITY_SECRET"
          echo "INTERNAL_IDENTITY_SECRET=$INTERNAL_IDENTITY_SECRET" >> "$GITHUB_ENV"
      - name: Configure Foundry environment
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          AZURE_AI_PROJECT_ID: ${{ vars.AZURE_AI_PROJECT_ID }}
          MODEL_DEPLOYMENT_NAME: ${{ vars.MODEL_DEPLOYMENT_NAME }}
          TRIAGE_MODEL_DEPLOYMENT_NAME: ${{ vars.TRIAGE_MODEL_DEPLOYMENT_NAME }}
          ACCOUNT_MODEL_DEPLOYMENT_NAME: ${{ vars.ACCOUNT_MODEL_DEPLOYMENT_NAME }}
          TRANSACTION_MODEL_DEPLOYMENT_NAME: ${{ vars.TRANSACTION_MODEL_DEPLOYMENT_NAME }}
          ACCOUNT_MCP_URL: ${{ vars.ACCOUNT_MCP_URL }}
          TRANSACTION_MCP_URL: ${{ vars.TRANSACTION_MCP_URL }}
          TOOLBOX_BANKING_TOOLS_MCP_ENDPOINT: ${{ vars.TOOLBOX_BANKING_TOOLS_MCP_ENDPOINT }}
          ENABLE_INSTRUMENTATION: ${{ vars.ENABLE_INSTRUMENTATION }}
          ENABLE_SENSITIVE_DATA: ${{ vars.ENABLE_SENSITIVE_DATA }}
          AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING: ${{ vars.AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING }}
          OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${{ vars.OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT }}
        run: |
          set -euo pipefail
          for var in AZURE_AI_PROJECT_ID FOUNDRY_PROJECT_ENDPOINT MODEL_DEPLOYMENT_NAME ACCOUNT_MCP_URL TRANSACTION_MCP_URL TOOLBOX_BANKING_TOOLS_MCP_ENDPOINT; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required GitHub environment variable: $var"
              exit 1
            fi
          done
          node <<'NODE'
          const { remoteHttps } = require('./.github/actions/appservice-preflight/preflight.cjs');
          const { validateToolboxEndpoint } = require('./.github/actions/appservice-preflight/hosted.cjs');
          try {
            validateToolboxEndpoint(process.env.TOOLBOX_BANKING_TOOLS_MCP_ENDPOINT);
          } catch (error) {
            console.error(`::error::${error.message}`);
            process.exit(1);
          }
          for (const name of ['FOUNDRY_PROJECT_ENDPOINT', 'ACCOUNT_MCP_URL', 'TRANSACTION_MCP_URL']) {
            const value = process.env[name];
            if (!remoteHttps(value) || (name.endsWith('_MCP_URL') && new URL(value).pathname !== '/mcp')) {
              console.error(`::error::${name} must use its public HTTPS endpoint and documented path.`);
              process.exit(1);
            }
          }
          NODE
          if [ ${#INTERNAL_IDENTITY_SECRET} -lt 32 ]; then
            echo "::error::INTERNAL_IDENTITY_SECRET must contain at least 32 characters"
            exit 1
          fi
          for var in AZURE_TENANT_ID AZURE_AI_PROJECT_ID FOUNDRY_PROJECT_ENDPOINT MODEL_DEPLOYMENT_NAME \
                     TRIAGE_MODEL_DEPLOYMENT_NAME ACCOUNT_MODEL_DEPLOYMENT_NAME TRANSACTION_MODEL_DEPLOYMENT_NAME \
                     ACCOUNT_MCP_URL TRANSACTION_MCP_URL TOOLBOX_BANKING_TOOLS_MCP_ENDPOINT \
                     ENABLE_INSTRUMENTATION ENABLE_SENSITIVE_DATA \
                     AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING \
                     OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT \
                     INTERNAL_IDENTITY_SECRET; do
            azd -C app/agent env set "$var" "${!var}"
          done
      - name: Record OAuth deployment boundary
        run: |
          echo "::warning::Hosted foundry/oauth remains fail-closed in the runtime adapter until native banking-user/grant binding is verified. Deployment does not enable OAuth Toolbox calls."
          echo "OAuth connections account-mcp and transaction-mcp must already be owner-configured in the selected project with exact platform callbacks and mcp.access. This workflow does not register clients or configure connections." >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy hosted agent artifact
        run: azd -C app/agent deploy home-banking-agent --no-prompt
      - name: Show agent status
        run: azd -C app/agent ai agent show --no-prompt
