name: Hosted Agent CI

on:
  push:
    branches: ["main", "develop", "feature/*", "refactor/*", "fix/*"]
    paths:
      - "app/agent/**"
      - "!app/agent/**/*.md"
      - "evals/**"
      - "!evals/**/*.md"
      - "evals/dispute_freeze.json"
      - "evals/replay_cases.json"
      - "evals/dispute_cases.json"
      - "app/business-api/account/src/banking_account/mcp_tools.py"
      - "app/business-api/transaction/src/banking_transaction/mcp_tools.py"
      - "app/business-api/transaction/src/banking_transaction/models/**"
      - ".github/workflows/ci-hosted-agent.yml"
      - ".github/actions/ci-python/**"
  pull_request:
    branches: ["main", "develop"]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "app/agent/**"
      - "!app/agent/**/*.md"
      - "evals/**"
      - "!evals/**/*.md"
      - "evals/dispute_freeze.json"
      - "evals/replay_cases.json"
      - "evals/dispute_cases.json"
      - "app/business-api/account/src/banking_account/mcp_tools.py"
      - "app/business-api/transaction/src/banking_transaction/mcp_tools.py"
      - "app/business-api/transaction/src/banking_transaction/models/**"
      - ".github/workflows/ci-hosted-agent.yml"
      - ".github/actions/ci-python/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-and-test:
    name: Build & Test (Hosted Agent)
    runs-on: ubuntu-latest
    env:
      OTEL_SDK_DISABLED: "true"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Verify isolated hosted dependencies
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$(mktemp -d)"
          trap 'rm -rf "$package_dir"' EXIT
          cp app/agent/pyproject.toml app/agent/uv.lock app/agent/README.md \
             app/agent/requirements.txt app/agent/main.py "$package_dir/"
          cp -R app/agent/src "$package_dir/src"
          uv lock --project "$package_dir" --check
          cd "$package_dir"
          uv export --frozen --no-dev --no-editable --no-hashes --no-header \
            --output-file requirements.generated.txt > /dev/null
          diff -u requirements.txt requirements.generated.txt
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python --requirements requirements.txt
          .venv/bin/python -c "import main"
          cd ..
          "$package_dir/.venv/bin/python" -c "import app; from importlib.resources import files; assert all('site-packages' in path for path in app.__path__); assert files('app').joinpath('logging-default.yaml').is_file()"
      - name: Install agent and evaluation dependencies
        run: uv sync --project evals --extra offline --extra model --frozen
      - name: Compile agent source
        run: uv run --project evals --frozen --no-sync python -m compileall -q app/agent/src
      - name: Run agent tests
        run: uv run --project evals --frozen --no-sync python -m pytest app/agent/tests -q --junitxml=app/agent/junit.xml
      - name: Upload agent test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: agent-test-results
          path: app/agent/junit.xml
          retention-days: 14
          if-no-files-found: error

  dispute-offline:
    name: Dispute Replay (offline structured checks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install evaluation dependencies
        run: uv sync --project evals --extra offline --extra model --frozen
      - name: Run offline dispute alignment regressions
        run: uv run --project evals --frozen --no-sync python -m pytest evals/tests -q --junitxml=evals/results/dispute-tests.xml
      - name: Execute deterministic comparator
        run: uv run --project evals --frozen --no-sync python -m banking_evals.run_dispute_replay --system baseline --timeout-seconds 10 --output evals/results/dispute-baseline.json
      - name: Rescore saved evidence
        run: uv run --project evals --frozen --no-sync python -m banking_evals.run_dispute_replay --rescore evals/results/dispute-baseline.json --output evals/results/dispute-rescored.json
      - name: Publish structured summary
        if: always()
        shell: bash
        run: |
          if [ -f evals/results/dispute-baseline.md ]; then
            cat evals/results/dispute-baseline.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Dispute baseline evidence is missing; this is not a verified evaluation." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload offline dispute evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dispute-offline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evals/results/dispute-tests.xml
            evals/results/dispute-*.json
            evals/results/dispute-*.xml
            evals/results/dispute-*.md
          retention-days: 14
          if-no-files-found: error

  semantic-technical-offline:
    name: Semantic Technical Offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install credential-free evaluation dependencies
        run: uv sync --project evals --extra offline --frozen
      - name: Test offline semantic contracts and deterministic evaluator
        run: uv run --project evals --frozen --no-sync python -m pytest evals/tests/test_semantic_contracts.py evals/tests/test_semantic_dataset.py evals/tests/test_semantic_judge.py evals/tests/test_semantic_reports.py evals/tests/test_semantic_cli.py evals/tests/test_semantic_provider.py evals/tests/test_semantic_technical.py -q --junitxml=evals/results/semantic-technical-tests.xml
      - name: Evaluate saved synthetic trace without model calls
        if: ${{ !cancelled() }}
        run: uv run --project evals --frozen --no-sync python -m banking_evals.semantic.technical --evidence evals/semantic_technical_evidence.json --output evals/results/semantic-technical.json
      - name: Upload deterministic technical evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: semantic-technical-offline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evals/semantic_technical_evidence.json
            evals/results/semantic-technical.json
            evals/results/semantic-technical-tests.xml
          retention-days: 14
          if-no-files-found: error

  replay-smoke:
    name: MCP Replay Smoke
    needs: build-and-test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: Development
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      OTEL_SDK_DISABLED: "true"
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      MODEL_DEPLOYMENT_NAME: ${{ vars.MODEL_DEPLOYMENT_NAME }}
      TRIAGE_MODEL_DEPLOYMENT_NAME: ${{ vars.TRIAGE_MODEL_DEPLOYMENT_NAME }}
      ACCOUNT_MODEL_DEPLOYMENT_NAME: ${{ vars.ACCOUNT_MODEL_DEPLOYMENT_NAME }}
      TRANSACTION_MODEL_DEPLOYMENT_NAME: ${{ vars.TRANSACTION_MODEL_DEPLOYMENT_NAME }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Validate model configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in FOUNDRY_PROJECT_ENDPOINT MODEL_DEPLOYMENT_NAME AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing Development variable: $key"
              exit 1
            fi
          done
      - name: Install evaluation dependencies
        run: uv sync --project evals --extra offline --extra model --frozen
      - name: Azure model login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run real-model replay
        shell: bash
        run: |
          uv run --project evals --frozen --no-sync python -m banking_evals.run_mcp_replay \
            --project-endpoint "$FOUNDRY_PROJECT_ENDPOINT" --model "$MODEL_DEPLOYMENT_NAME" \
            --triage-model "$TRIAGE_MODEL_DEPLOYMENT_NAME" \
            --account-model "$ACCOUNT_MODEL_DEPLOYMENT_NAME" \
            --transaction-model "$TRANSACTION_MODEL_DEPLOYMENT_NAME" \
            --output evals/results/mcp-replay.json
      - name: Validate and render protocol report
        if: always()
        shell: bash
        run: |
          status=0
          uv run --project evals --frozen --no-sync python -m banking_evals.replay_summary --report evals/results/mcp-replay.json \
            --dataset evals/replay_cases.json --output evals/results/replay-summary.md || status=$?
          cat evals/results/replay-summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload synthetic replay evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mcp-replay-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: evals/results/
          retention-days: 14
          if-no-files-found: error
      - name: Update PR smoke report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- banking-mcp-replay-smoke -->';
            const path = 'evals/results/replay-summary.md';
            const summary = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '## MCP Replay Smoke\n\nFAILED: no report; execution is not verified.';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n${summary}\n[Run and evidence artifacts](${run})\n\nCommit: ${context.payload.pull_request.head.sha}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number, per_page: 100
            });
            const existing = comments.find(comment => comment.user.type === 'Bot' && comment.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({...context.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
            }

  replay-fork-notice:
    name: MCP Replay Smoke unavailable (fork)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report unverified fork replay
        run: echo "MCP replay was NOT EXECUTED for this fork PR. No Azure credentials or PR write token are exposed. This is not evaluation evidence." >> "$GITHUB_STEP_SUMMARY"
