name: Manual Development database operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit operation (OAuth initialization never applies migrations)
        type: choice
        options: [migrate, init-oauth, register-client]
        required: true
      confirmation:
        description: Type the exact operation followed by :Development (for example migrate:Development)
        type: string
        required: true
      client_id:
        description: Additional OAuth client ID; leave all three client inputs blank for the configured BFF
        type: string
        required: false
      redirect_uri:
        description: Exact HTTPS callback of the additional client; never a guessed Foundry callback
        type: string
        required: false
      client_secret_name:
        description: Separate Key Vault secret name for the additional client (not a secret value)
        type: string
        required: false
      legacy_user_status:
        description: Migration-only legacy identity policy; leave unspecified unless explicitly approved
        type: choice
        options: [unspecified, active, inactive]
        default: unspecified

permissions: {}

# All manual writers to this shared database must use this concurrency group.
concurrency:
  group: database-operations-development
  cancel-in-progress: false

jobs:
  operate:
    environment: Development
    runs-on: ${{ fromJSON(vars.AZURE_DB_OPERATIONS_RUNNER || '"ubuntu-latest"') }}
    permissions:
      contents: read
      id-token: write
    env:
      OTEL_SDK_DISABLED: "true"
      OPERATION: ${{ inputs.operation }}
      CONFIRMATION: ${{ inputs.confirmation }}
      LEGACY_USER_STATUS: ${{ inputs.legacy_user_status }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
      AZURE_POSTGRES_SERVER_NAME: ${{ vars.AZURE_POSTGRES_SERVER_NAME }}
      AZURE_POSTGRES_DATABASE_NAME: ${{ vars.AZURE_POSTGRES_DATABASE_NAME }}
      OAUTH_SIGNING_KEY_URI: ${{ vars.OAUTH_SIGNING_KEY_URI }}
      OAUTH_SIGNING_KEY_ID: ${{ vars.OAUTH_SIGNING_KEY_ID }}
      OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
      OAUTH_REDIRECT_URI: ${{ vars.OAUTH_REDIRECT_URI }}
      ADDITIONAL_CLIENT_ID: ${{ inputs.client_id }}
      ADDITIONAL_REDIRECT_URI: ${{ inputs.redirect_uri }}
      ADDITIONAL_CLIENT_SECRET_NAME: ${{ inputs.client_secret_name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate explicit operation and configuration
        shell: bash
        env:
          AZURE_OPERATIONS_CLIENT_ID: ${{ vars.AZURE_OPERATIONS_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "$OPERATION:Development" ]] || { echo '::error::Confirmation does not match'; exit 1; }
          case "$OPERATION" in migrate|init-oauth|register-client) ;; *) exit 1;; esac
          for name in AZURE_OPERATIONS_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_KEY_VAULT_NAME AZURE_POSTGRES_SERVER_NAME AZURE_POSTGRES_DATABASE_NAME; do
            [[ -n "${!name//[[:space:]]/}" ]] || { echo "::error::$name is required"; exit 1; }
          done
          if [[ -n "$ADDITIONAL_CLIENT_ID$ADDITIONAL_REDIRECT_URI$ADDITIONAL_CLIENT_SECRET_NAME" ]]; then
            [[ "$OPERATION" != migrate ]] || { echo '::error::Client inputs are not valid for migrations'; exit 1; }
            for name in ADDITIONAL_CLIENT_ID ADDITIONAL_REDIRECT_URI ADDITIONAL_CLIENT_SECRET_NAME; do
              [[ -n "${!name//[[:space:]]/}" ]] || { echo "::error::$name is required for an additional client"; exit 1; }
            done
            [[ "$ADDITIONAL_CLIENT_ID" =~ ^[A-Za-z0-9_-]{1,128}$ ]] || { echo '::error::Invalid additional client ID'; exit 1; }
            [[ "$ADDITIONAL_CLIENT_SECRET_NAME" =~ ^oauth-client-[a-z0-9-]{1,114}$ ]] || { echo '::error::Invalid Key Vault secret name'; exit 1; }
            [[ "$ADDITIONAL_CLIENT_ID" != "$OAUTH_CLIENT_ID" && "${ADDITIONAL_CLIENT_SECRET_NAME,,}" != oauth-client-secret ]] || { echo '::error::Additional clients must not reuse the BFF client ID or secret'; exit 1; }
            [[ "$ADDITIONAL_REDIRECT_URI" == https://* && ! "$ADDITIONAL_REDIRECT_URI" =~ [[:space:]] ]] || { echo '::error::An exact HTTPS callback without whitespace is required'; exit 1; }
          elif [[ "$OPERATION" != migrate ]]; then
            for name in OAUTH_CLIENT_ID OAUTH_REDIRECT_URI; do
              [[ -n "${!name//[[:space:]]/}" ]] || { echo "::error::$name is required"; exit 1; }
            done
          fi
          if [[ "$OPERATION" == init-oauth ]]; then
            [[ -n "$OAUTH_SIGNING_KEY_URI" && -n "$OAUTH_SIGNING_KEY_ID" ]] || exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - name: Install reviewed packages without dotenv
        shell: bash
        run: |
          set -euo pipefail
          uv sync --directory app/business-api/identity --frozen
          if [[ "$OPERATION" == migrate ]]; then
            uv sync --directory app/business-api/data --frozen
          fi
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_OPERATIONS_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify Azure target and execute the single explicit operation
        shell: bash
        run: |
          set -euo pipefail
          # ARM reads verify the server, database and vault in the selected subscription/resource group.
          expected_host=$(az postgres flexible-server show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_POSTGRES_SERVER_NAME" --query fullyQualifiedDomainName --output tsv --only-show-errors)
          database=$(az postgres flexible-server db show --resource-group "$AZURE_RESOURCE_GROUP" --server-name "$AZURE_POSTGRES_SERVER_NAME" --name "$AZURE_POSTGRES_DATABASE_NAME" --query name --output tsv --only-show-errors)
          vault_url=$(az keyvault show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_KEY_VAULT_NAME" --query properties.vaultUri --output tsv --only-show-errors)
          [[ "$database" == "$AZURE_POSTGRES_DATABASE_NAME" && -n "$expected_host" && -n "$vault_url" ]] || exit 1
          arguments=("$OPERATION" --credential azure-cli --vault-url "$vault_url" --expected-host "$expected_host" --expected-database "$database" --confirm)
          if [[ "$OPERATION" == migrate ]]; then
            arguments+=(--data-project "$GITHUB_WORKSPACE/app/business-api/data")
            if [[ "$LEGACY_USER_STATUS" != unspecified ]]; then
              arguments+=(--legacy-user-status "$LEGACY_USER_STATUS")
            fi
          else
            if [[ -n "$ADDITIONAL_CLIENT_ID" ]]; then
              arguments+=(--client-id "$ADDITIONAL_CLIENT_ID" --redirect-uri "$ADDITIONAL_REDIRECT_URI" --client-secret-name "$ADDITIONAL_CLIENT_SECRET_NAME")
            else
              arguments+=(--client-id "$OAUTH_CLIENT_ID" --redirect-uri "$OAUTH_REDIRECT_URI")
            fi
            if [[ "$OPERATION" == init-oauth ]]; then
              arguments+=(--key-uri "$OAUTH_SIGNING_KEY_URI" --key-id "$OAUTH_SIGNING_KEY_ID")
            fi
          fi
          uv run --directory app/business-api/identity --frozen --no-env-file python -m identity.services.oauth_remote "${arguments[@]}"
      - name: Record controlled result
        shell: bash
        run: |
          printf 'Operation `%s` completed at reviewed commit `%s`. This is not OAuth/browser acceptance.\n' "$OPERATION" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
