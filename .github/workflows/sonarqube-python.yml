name: SonarQube Python

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'refactor/**'
      - 'chore/**'
    paths:
      - 'app/agent/**'
      - 'app/business-api/**'
      - 'app/responses-bff/**'
      - 'evals/**'
      - 'sonar-project.python.properties'
      - '.github/workflows/sonarqube-python.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'app/agent/**'
      - 'app/business-api/**'
      - 'app/responses-bff/**'
      - 'evals/**'
      - 'sonar-project.python.properties'
      - '.github/workflows/sonarqube-python.yml'

jobs:
  sonarqube:
    name: SonarQube Python
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Collect Python coverage
        shell: bash
        env:
          OTEL_SDK_DISABLED: "true"
        run: |
          set -uo pipefail
          for project in app/agent app/responses-bff app/business-api/identity app/business-api/account app/business-api/transaction app/business-api/data evals; do
            extra=""
            if [ "$project" = "evals" ]; then extra="--extra offline"; fi
            if (cd "$project" && uv run --frozen $extra --with pytest-cov python -m pytest -q tests --cov=src --cov-report=xml:coverage.xml); then
              :
            else
              echo "::warning::Tests failed or produced partial coverage for $project"
            fi
            if [ -f "$project/coverage.xml" ]; then
              # Coverage filenames are relative to src; Sonar resolves them from the repository root
              sed -i "s#filename=\"#filename=\"$project/src/#g" "$project/coverage.xml"
            fi
          done
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Python Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >
            -Dproject.settings=sonar-project.python.properties
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_PYTHON }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
