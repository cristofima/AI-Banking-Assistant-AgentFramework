name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - "app/frontend/banking-web/**"
      - "!app/frontend/banking-web/**/*.md"
      - ".github/workflows/cd-frontend.yaml"
      - ".github/actions/cd-azure/**"
      - ".github/actions/appservice-preflight/**"
      - "azure.yaml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cd-azure
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          location: ${{ vars.AZURE_APP_SERVICE_LOCATION }}
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          app-service-name: ${{ vars.AZURE_WEB_APP_NAME }}
          app-service-name-variable: AZURE_WEB_APP_NAME
      - name: Configure frontend build-time environment
        # Vite consumes public URLs at build time. OAuth reuses the BFF URL;
        # no browser client secret or separate Identity/agent URL is injected.
        env:
          VITE_ACCOUNT_API_URL: ${{ vars.VITE_ACCOUNT_API_URL }}
          VITE_TRANSACTION_API_URL: ${{ vars.VITE_TRANSACTION_API_URL }}
          VITE_RESPONSES_BFF_URL: ${{ vars.VITE_RESPONSES_BFF_URL }}
          VITE_RESPONSES_API_URL: ${{ vars.VITE_RESPONSES_API_URL }}
        run: |
          set -euo pipefail
          node --test .github/actions/appservice-preflight/preflight.test.cjs
          node .github/actions/appservice-preflight/frontend.cjs
          for var in VITE_ACCOUNT_API_URL VITE_TRANSACTION_API_URL VITE_RESPONSES_BFF_URL VITE_RESPONSES_API_URL; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required GitHub environment variable: $var"
              exit 1
            fi
            azd env set "$var" "${!var}"
          done
      - name: Deploy frontend
        run: azd deploy web --no-prompt
