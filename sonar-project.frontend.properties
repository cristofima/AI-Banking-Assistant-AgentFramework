sonar.sourceEncoding=UTF-8

# TypeScript project in monorepo
sonar.sources=app/frontend/banking-web/src
sonar.inclusions=**/*.ts,**/*.tsx
sonar.javascript.lcov.reportPaths=app/frontend/banking-web/coverage/lcov.info
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.d.ts,**/*.test.ts,**/*.test.tsx

# Tests live beside sources; keep them out of production code and coverage so test-only changes have no new lines to cover
sonar.tests=app/frontend/banking-web/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx
