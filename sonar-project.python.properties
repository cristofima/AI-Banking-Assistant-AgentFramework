sonar.sourceEncoding=UTF-8

# Monorepo broad source roots for Python project
sonar.sources=evals,app/agent,app/business-api,app/responses-bff

# Keep Python project isolated from frontend TypeScript project
sonar.inclusions=**/*.py

# Exclude generated, vendored and non-Python assets for this project
sonar.exclusions=app/frontend/**,**/__pycache__/**,**/*.pyc,**/.venv/**,**/build/**,**/dist/**,**/.pytest_cache/**,**/node_modules/**,**/*.egg-info/**,**/coverage/**,**/.coverage,**/junit.xml,**/uv.lock,**/package-lock.json,**/pnpm-lock.yaml,**/yarn.lock,**/alembic/versions/**,**/tests/**,**/conftest.py

# Test directories are declared as tests, so test-only changes add no production lines needing coverage
sonar.tests=evals/tests,app/agent/tests,app/business-api/account/tests,app/business-api/data/tests,app/business-api/identity/tests,app/business-api/transaction/tests,app/responses-bff/tests
sonar.test.inclusions=**/tests/**/*.py
sonar.coverage.exclusions=**/tests/**,**/conftest.py

# Generated by the SonarQube Python workflow; missing reports only produce warnings
sonar.python.coverage.reportPaths=app/agent/coverage.xml,app/responses-bff/coverage.xml,app/business-api/identity/coverage.xml,app/business-api/account/coverage.xml,app/business-api/transaction/coverage.xml,app/business-api/data/coverage.xml,evals/coverage.xml
