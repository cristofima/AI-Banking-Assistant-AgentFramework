[project]
name = "banking-identity"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "banking-shared[telemetry]",
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "pyjwt==2.10.1",
  "authlib==1.9.1",
  "azure-identity>=1.19,<2",
  "azure-keyvault-keys>=4.10,<5",
  "azure-keyvault-secrets>=4.9,<5",
  "python-multipart==0.0.32",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
banking-bootstrap-admin = "identity.services.bootstrap:main"
banking-provision-oauth-client = "identity.services.oauth_provisioning:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx==0.28.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["identity*"]

[tool.uv.sources]
banking-shared = { path = "../shared", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
