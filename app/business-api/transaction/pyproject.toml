[project]
name = "banking-assistant-transaction-mcp"
version = "0.1.0"
description = "Python MCP server for transactions business-api using fastmcp"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "banking-shared[telemetry]",
    "fastmcp==3.4.7",
    "pydantic==2.13.5",
    "fastapi[all]==0.141.1",
    "psycopg[binary]>=3.2,<4",
    "sqlmodel>=0.0.24,<1",
    "uvicorn==0.54.0",
    "pyjwt==2.10.1",
    "authlib==1.9.1",
]

[tool.uv.sources]
banking-shared = { path = "../shared", editable = true }
banking-evals = { path = "../../../evals", editable = true }

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "banking-evals"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/banking_transaction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
