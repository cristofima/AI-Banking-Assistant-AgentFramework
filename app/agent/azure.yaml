# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
requiredVersions:
  azd: ">=1.27.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.9"
name: home-banking-hosted-agent
services:
  ai-project:
    host: azure.ai.project
    endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
    deployments:
      - name: model-router
        model:
          format: OpenAI
          name: model-router
          version: "2025-11-18"
        sku:
          name: GlobalStandard
          capacity: 10
      - name: gpt-5.4
        model:
          format: OpenAI
          name: gpt-5.4
          version: "2026-03-05"
        sku:
          name: GlobalStandard
          capacity: 10
  banking-tools:
    host: azure.ai.toolbox
    description: >
      Customer MCP tools through OAuth project connections using mcp.access.
    tools:
      - type: mcp
        server_label: account
        server_url: ${ACCOUNT_MCP_URL}
        project_connection_id: account-mcp
        allowed_tools:
          - getAccountsByUserName
          - getAccountDetails
          - getRegisteredBeneficiary
          - getCreditCards
          - discoverCardsBySuffix
          - getCardDetails
      - type: mcp
        server_label: transaction
        server_url: ${TRANSACTION_MCP_URL}
        project_connection_id: transaction-mcp
        allowed_tools:
          - getTransactionsByRecipientName
          - getCardTransactions
          - getLastTransactions
          - getTransactionRecognitionContext
          - previewTransactionDispute
          - reportTransactionDispute
          - recoverTransactionDispute
          - respondToDisputeApproval
          - listSupportCases
          - getSupportCase
          - getSupportCaseTimeline
  home-banking-agent:
    host: azure.ai.agent
    project: .
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    uses:
      - ai-project
      - banking-tools
    kind: hosted
    name: home-banking-agent
    metadata:
      tags:
        - Banking Assistant
        - Agent Framework
        - Azure AI AgentServer
    description: >
      Hosted agent orchestrating account and transaction MCP servers through the Responses protocol.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AGENT_RUNTIME: foundry
      MCP_IDENTITY_MODE: oauth
      FOUNDRY_PROJECT_ENDPOINT: ${FOUNDRY_PROJECT_ENDPOINT}
      MODEL_DEPLOYMENT_NAME: ${MODEL_DEPLOYMENT_NAME}
      TRIAGE_MODEL_DEPLOYMENT_NAME: ${TRIAGE_MODEL_DEPLOYMENT_NAME}
      ACCOUNT_MODEL_DEPLOYMENT_NAME: ${ACCOUNT_MODEL_DEPLOYMENT_NAME}
      TRANSACTION_MODEL_DEPLOYMENT_NAME: ${TRANSACTION_MODEL_DEPLOYMENT_NAME}
      ACCOUNT_MCP_URL: ${ACCOUNT_MCP_URL}
      TRANSACTION_MCP_URL: ${TRANSACTION_MCP_URL}
      INTERNAL_IDENTITY_SECRET: ${INTERNAL_IDENTITY_SECRET}
      ENABLE_INSTRUMENTATION: ${ENABLE_INSTRUMENTATION}
      ENABLE_SENSITIVE_DATA: ${ENABLE_SENSITIVE_DATA}
      AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING: ${AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT}
    container:
      resources:
        cpu: "1.0"
        memory: 2.0Gi
infra:
  provider: microsoft.foundry
