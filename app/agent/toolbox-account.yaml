# Separate from toolbox-transaction.yaml: a Toolbox lists every source, so each user is
# asked to consent only to the connections of the Toolbox the agent actually opens.
# The project connection must use OAuth2 with scope mcp.access, not auth-type none.
# Connection references do not configure OAuth credentials or prove per-user grant binding.
# Keep local execution on direct MCP; remote Toolbox activation requires two-user validation.
# Never store a static customer bearer or either internal signer in a connection.
name: account-tools
description: Account MCP tools for the banking handoff workflow
tools:
  - type: mcp
    server_label: account
    project_connection_id: account-mcp
    allowed_tools:
      - getAccountsByUserName
      - getAccountDetails
      - getRegisteredBeneficiary
      - getCreditCards
      - discoverCardsBySuffix
      - getCardDetails
