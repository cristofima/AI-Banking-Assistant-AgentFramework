[project]
name = "banking-assistant-responses-bff"
version = "0.1.0"
description = "JWT-protected proxy for the banking assistant Responses API"
requires-python = ">=3.11"
dependencies = [
    "banking-shared[telemetry]",
    "authlib==1.9.1",
    "aiohttp>=3.9,<4",
    "azure-identity==1.25.3",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pyjwt==2.10.1",
    "pydantic-settings>=2.0,<3",
    "uvicorn==0.54.0",
]

[tool.uv.sources]
banking-shared = { path = "../business-api/shared", editable = true }

[dependency-groups]
dev = ["asgi-lifespan", "pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["bff*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
